<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link rel="stylesheet" href="/css/main.css"></head><body>



<div class="us-quantity custom-class"
     x-data="{ qty: 1 }"
     x-modelable="qty"
     >
    <button class="us-quantity__minus" type="button" x-on:click="if(qty > 1) qty--"><svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M0.699219 0.700012H10.6992" stroke="#393939" stroke-width="1.4" stroke-linecap="round"/>
</svg>
</button>

    <input class="us-quantity__input" name="custom-name" type="number" x-model.number="qty" x-on:input="if ($el.value < 1) qty = 1">

    <button class="us-quantity__plus" type="button" x-on:click="qty++"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M5.69922 0.700012V10.7M0.699219 5.8852H10.6992" stroke="#393939" stroke-width="1.4" stroke-linecap="round"/>
</svg>
</button>
</div>
<script src="/js/main.js"></script></body>
