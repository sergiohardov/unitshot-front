<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><link rel="stylesheet" href="/css/main.css"></head><body><div class="us-range">
    <div class="us-range__price-input">
        <input class="us-range__input-min" type="number" value="0">
        <div class="us-range__separator"></div>
        <input class="us-range__input-max" type="number" value="1000">
    </div>

    <div class="us-range__range-input">
        <div class="us-range__slider"><div class="us-range__progress" style="left: 0%; right: 0%"></div></div>
        <input class="us-range__range-min" type="range" min="0" max="1000" value="0" step="100">
        <input class="us-range__range-max" type="range" min="0" max="1000" value="1000" step="100">
    </div>
</div>
<script src="/js/main.js"></script></body>
