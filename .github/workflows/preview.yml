name: Build and Push to Preview

# Срабатывает при пуше в ветку main
on:
  push:
    branches:
      - main

jobs:
  push-to-preview:
    # Разворачивает Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Разворачивает файлы текущей ветки (main)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраивает окружение Node.js (рекомендуется для корректной работы npm)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Замените на версию, которую используете в проекте

      # 3. Устанавливает зависимости и собирает проект
      - name: Install dependencies and Build
        run: |
          npm i
          npm run build # Замените на npm build, если именно так указано в ваших скриптах package.json

      # 4. Удаляем лишнее
      - name: Remove twig folder from dist
        run: rm -rf dist/twig

      # 5. Перемещает содержимое папки dist в ветку preview
      - name: Deploy dist to preview branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: preview       # Название целевой ветки
          folder: dist          # Папка, содержимое которой нужно запушить
          clean: true           # Явно удаляет файлы в целевой ветке, которых нет в папке dist
          single-commit: true   # Перезаписывает ветку preview одним коммитом (затирая всё, что было добавлено вручную)
